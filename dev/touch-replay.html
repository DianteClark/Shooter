<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switchyard touch replay</title>
<link rel="stylesheet" href="../css/game.css">
<style>
  body { margin: 0; padding: 12px; background: #111418; color: #e7eae4; font: 13px/1.4 system-ui, sans-serif; overflow: auto; height: auto; position: static; }
  textarea { width: 100%; height: 90px; font: 11px ui-monospace, Menlo, monospace; background: #0b0e12; color: #b8f0c0; border: 1px solid #333; }
  pre { white-space: pre-wrap; font: 11px/1.35 ui-monospace, Menlo, monospace; position: relative; z-index: 5; }
  .replay-targets { position: fixed; left: 0; top: 0; width: 0; height: 0; overflow: visible; }
  .controls { display: none; }
</style>
</head>
<body>
<h3>Touch replay</h3>
<p>Paste a report code (it starts with SWT1), or open this page with <code>?file=touch-reports/name.txt</code>.</p>
<textarea id="code" placeholder="SWT1d...."></textarea>
<p><button id="go">Replay</button> <label><input type="checkbox" id="quiet"> hide the phone's own notes</label></p>
<pre id="out"></pre>
<script type="module">
  import { replayTouches } from './touch-replay.mjs';
  const out = document.getElementById('out');
  const run = async code => {
    out.textContent = 'Replaying...';
    try {
      const res = await replayTouches(code, { quiet: document.getElementById('quiet').checked });
      out.textContent = res.lines.join('\n');
      console.log(res.lines.join('\n'));
    } catch (err) {
      out.textContent = `Error: ${err?.stack ?? err}`;
    }
  };
  document.getElementById('go').addEventListener('click', () => run(document.getElementById('code').value));
  const file = new URLSearchParams(location.search).get('file');
  if (file) fetch(file).then(r => r.text()).then(text => { document.getElementById('code').value = text.trim(); run(text); });
</script>
</body>
</html>
