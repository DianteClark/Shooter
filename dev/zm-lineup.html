<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Undead lineup</title>
<style>html, body { margin: 0; background: #1b1d22; } canvas { display: block; }
#lab { position: fixed; inset: 0; pointer-events: none; font: 600 11px system-ui; color: #eee; text-shadow: 0 1px 2px #000; }
#lab span { position: absolute; transform: translate(-50%, 0); white-space: nowrap; }</style>
</head>
<body>
<canvas id="c"></canvas><div id="lab"></div>
<script type="importmap">{ "imports": { "three": "../vendor/three.min.js" } }</script>
<script type="module">
// Every Graveyard Shift undead kind side by side (js/render/zm-bodies.js, zm-models.js), for reviewing silhouettes and
// animation (dev only; docs/ZOMBIES.md "Bodies").
//   ?view=game|close|front   the match camera at match scale, the same tilt close up, or eye level
//   &anim=idle|walk|run|windup|strike|rise|death|head|blast   what they do (walk/run in place; death kinds at t=0.6 s)
//   &kinds=1,2,3   a subset by the view's zk      &t=1.2  seconds to run before the picture is held (window.__ready)
//   &theme=railyard   lighting      &lite=1  the distance LOD      &w=852&h=393
import * as THREE from 'three';
import { setThemeLighting } from '../js/render/art.js';
import { ZmBodies } from '../js/render/zm-bodies.js';
import { ZM_MODELS } from '../js/render/zm-models.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 852), H = +(q.get('h') || 393), view = q.get('view') || 'close', anim = q.get('anim') || 'idle';
setThemeLighting(q.get('theme') || 'railyard');
const canvas = document.getElementById('c');
const webgl = new THREE.WebGLRenderer({ canvas, antialias: true });
webgl.setPixelRatio(q.get('dpr') ? +q.get('dpr') : 2);
webgl.setSize(W, H);
webgl.setClearColor(0x3a3d38);
const scene = new THREE.Scene();
const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200), new THREE.MeshBasicMaterial({ color: 0x4a4d46 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const kinds = q.get('kinds') ? q.get('kinds').split(',').map(Number) : Object.keys(ZM_MODELS).map(Number);
const gap = view === 'game' ? 2.2 : 2.6, per = kinds.length;
const bodies = new ZmBodies(scene, null);
const chars = { rigs: new Map(), corpses: { limit: 16 } };
const aim = +(q.get('aim') ?? (view === 'front' ? 1.57 : 0.9));
let xs = 0; const at = [];
for (const k of kinds) { const s = ZM_MODELS[k].dims.s; xs += (at.length ? gap * 0.5 * s : 0); at.push(xs); xs += gap * 0.5 * s; }
const players = kinds.map((zk, i) => ({ id: 'z' + i, zk, x: at[i] - xs / 2 + gap * 0.25, z: 0, aim, vx: 0, vz: 0, alive: true, zshield: zk === 9, zswing: false }));
for (const p of players) chars.rigs.set(p.id, { visible: true, reveal: 1, lite: q.get('lite') === '1', id: p.id });
const cam = new THREE.PerspectiveCamera(view === 'front' ? 30 : 26, W / H, 0.5, 300);
if (view === 'front') { const d = (xs + 1.5) / (2 * Math.tan(THREE.MathUtils.degToRad(15)) * (W / H)); const tall = kinds.some(k => ZM_MODELS[k].dims.s > 1.4) ? 1.6 : 1; cam.position.set(0, 1.3 * tall, d); cam.lookAt(0, 1.0 * tall, 0); }
else {
  const TILT = THREE.MathUtils.degToRad(55);
  const dist = view === 'game' ? 30 / (2 * Math.tan(THREE.MathUtils.degToRad(13)) * (W / H)) : (xs + 1.5) / (2 * Math.tan(THREE.MathUtils.degToRad(13)) * (W / H));
  cam.position.set(0, dist * Math.sin(TILT), dist * Math.cos(TILT));
  cam.lookAt(0, 0.6, 0);
}
const v = { t: 0, players };
const hold = +(q.get('t') ?? 1.2);
const sp = anim === 'run' ? 4.5 : anim === 'walk' ? 1.6 : 0;
// The first update sees them standing (no rise); a rise takes them away and brings them back.
bodies.update(v, 0.016, chars);
if (anim === 'rise') { for (const p of players) p.zk = 0; bodies.update(v, 0.016, chars); for (let i = 0; i < players.length; i++) players[i].zk = kinds[i]; }
let t = 0, killed = false;
function step(dt) {
  t += dt;
  for (const p of players) {
    const k = p.zk || 0, crawl = k === 8;
    p.vx = Math.cos(p.aim) * sp * (crawl ? 0.8 : 1) * (k === 7 ? 0.5 : 1); p.vz = Math.sin(p.aim) * sp * (crawl ? 0.8 : 1) * (k === 7 ? 0.5 : 1);
    p.zswing = anim === 'windup' ? true : anim === 'strike' ? t < hold - 0.12 : false;
  }
  if (!killed && ['death', 'head', 'blast'].includes(anim) && t > 0.6) {
    killed = true;
    for (const p of players) {
      const r = chars.rigs.get(p.id);
      bodies.onKill(r, { dirX: -Math.cos(p.aim), dirZ: -Math.sin(p.aim), head: anim === 'head', explosive: anim === 'blast', weapon: anim === 'blast' ? 'launcher' : 'ar' });
      p.alive = false; p.zk = 0;
    }
  }
  bodies.update(v, dt, chars);
}
// Run to the hold time in fixed steps, then keep animating at real time (window.__ready says the picture is held).
const fixed = q.get('live') !== '1';
if (fixed) { while (t < hold) step(1 / 60); window.__ready = true; webgl.render(scene, cam); }
const lab = document.getElementById('lab');
const names = { 1: 'Shambler', 2: 'Runner', 3: 'Brute', 4: 'Yardmaster', 5: 'Gravewarden', 6: 'Spitter', 7: 'Bloater', 8: 'Crawler', 9: 'Shieldbearer', 11: 'Listener', 12: 'Barker' };
lab.innerHTML = players.map(p => { const vv = new THREE.Vector3(p.x, 0, p.z + 1.2).project(cam); return `<span style="left:${(vv.x + 1) / 2 * W}px;top:${(1 - vv.y) / 2 * H + 4}px">${names[kinds[players.indexOf(p)]]}</span>`; }).join('');
let last = performance.now();
function frame(now) {
  if (!fixed) { step(Math.min(0.05, (now - last) / 1000)); last = now; webgl.render(scene, cam); window.__ready = true; }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__bodies = bodies;
</script>
</body>
</html>
