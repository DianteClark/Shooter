<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gun gallery</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; background: #1b1d22; color: #cfd3da; font: 11px/1.3 -apple-system, system-ui, sans-serif; }
  #c { display: block; }
  .lbl { position: absolute; font: 11px monospace; color: #fffc; pointer-events: none; }
</style>
<script type="importmap">{ "imports": { "three": "../vendor/three.min.js" } }</script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
// Every gun model on one sheet, for looking at the models (docs/WEAPONS-OVERHAUL.md "Visual pass"):
//   ?cat=Melee (one class) or ?ids=ar,smg (a list) or nothing (every gun); &camo=none; &kit=optic:reflex,mag:extmag
//   &views=side,top,game  (side: 3/4 from the right, top: straight down, game: the play camera's 55 degree tilt)
// Each cell is one gun in one view; the label under it gives the id and its triangle count. window.__ready when drawn.
import * as THREE from 'three';
import { getGun } from '../js/render/guns.js';
import { createCamoMaterial, addCamoInstanceAttributes, camoIndex } from '../js/render/camo-shader.js';
import { WEAPON_IDS, WEAPON_CATEGORY } from '../js/shared/constants.js';

const q = new URLSearchParams(location.search);
let ids = q.get('ids') ? q.get('ids').split(',') : WEAPON_IDS.slice();
if (q.get('cat')) ids = WEAPON_IDS.filter(id => WEAPON_CATEGORY[id] === q.get('cat'));
const views = (q.get('views') || 'side,top').split(',');
const kit = q.get('kit') ? Object.fromEntries(q.get('kit').split(',').map(p => p.split(':'))) : null;
const camo = q.get('camo') || 'none';
const CW = +(q.get('w') || 300), CH = +(q.get('h') || 150);
const cols = Math.max(1, Math.min(+(q.get('cols') || views.length * 2), 8));
const cells = [];
for (const id of ids) for (const v of views) cells.push({ id, v });
const rows = Math.ceil(cells.length / cols);
const canvas = document.getElementById('c');
const W = cols * CW, H = rows * (CH + 14);
const webgl = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
webgl.setPixelRatio(1); webgl.setSize(W, H); webgl.setClearColor(0x1b1d22, 1); webgl.setScissorTest(true);
const time = { value: 1.0 };
const mat = createCamoMaterial(time);
const cam = new THREE.PerspectiveCamera(22, CW / CH, 0.05, 50);
cells.forEach((c, i) => {
  const gun = getGun(c.id, kit && kit[c.id + '.'] ? null : kit);
  const geom = gun.geometry.clone();
  addCamoInstanceAttributes(geom, 1);
  geom.getAttribute('aCamo').setX(0, camoIndex(camo));
  const mesh = new THREE.InstancedMesh(geom, mat, 1);
  mesh.setMatrixAt(0, new THREE.Matrix4());
  mesh.frustumCulled = false;
  const scene = new THREE.Scene();
  scene.add(mesh);
  geom.computeBoundingBox();
  const bb = geom.boundingBox, ctr = new THREE.Vector3(), size = new THREE.Vector3();
  bb.getCenter(ctr); bb.getSize(size);
  mesh.position.copy(ctr).multiplyScalar(-1);
  const span = Math.max(size.x, size.z * 1.6, size.y * 2) * 1.0;
  const d = span / (2 * Math.tan(THREE.MathUtils.degToRad(11))) * 0.62;
  if (c.v === 'top') { cam.position.set(0, d, 0.0001); cam.up.set(0, 0, -1); }
  else if (c.v === 'game') { cam.position.set(0, d * Math.sin(1.0), d * Math.cos(1.0)); cam.up.set(0, 1, 0); }
  else { cam.position.set(-d * 0.18, d * 0.36, d * 0.92); cam.up.set(0, 1, 0); }
  cam.lookAt(0, 0, 0);
  const col = i % cols, row = Math.floor(i / cols);
  const x = col * CW, y = H - (row + 1) * (CH + 14) + 14;
  webgl.setViewport(x, y, CW, CH); webgl.setScissor(x, y, CW, CH);
  webgl.render(scene, cam);
  const tris = gun.geometry.attributes.position.count / 3;
  const l = document.createElement('div');
  l.className = 'lbl'; l.style.left = (x + 4) + 'px'; l.style.top = ((row + 1) * (CH + 14) - 14) + 'px';
  l.textContent = `${c.id} ${c.v} ${tris}t`;
  document.body.appendChild(l);
});
window.__ready = true;
</script>
</body>
</html>
