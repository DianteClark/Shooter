<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Z-fight check</title>
<link rel="icon" href="data:,">
<script type="importmap">{ "imports": { "three": "../vendor/three.min.js", "trystero": "../vendor/trystero.min.js" } }</script>
</head>
<body>
<canvas id="game" style="width:932px;height:430px"></canvas>
<script type="module">
// Finds coplanar, same-facing, overlapping triangles of different colours in a map's opaque meshes: the faces that
// z-fight (flicker) as the camera moves. Driven by dev/zfight-check.py; ?map=<id>. window.result holds the findings.
import * as THREE from 'three';
import { MAPS } from '../js/shared/map.js';
import { GameRenderer } from '../js/render/renderer.js';

const params = new URLSearchParams(location.search);
const map = MAPS[params.get('map') || 'railyard'];
const t0 = performance.now();
const r = new GameRenderer(document.getElementById('game'), map, { dynamicRes: false });
window.r = r;
window.buildMs = performance.now() - t0;

// Giant maps stream tiles in near the camera: walk the camera over the map so every tile is built.
async function loadAll() {}
// A giant map keeps only the tiles near the camera, so it is checked a patch at a time.
function checkGiant(maxReport) {
  const out = { tris: 0, count: 0, horiz: 0, vert: 0, sample: [] }, seenAt = new Set();
  for (let z = 30; z < map.height; z += 60) for (let x = 30; x < map.width; x += 60) {
    r.camera.position.set(x, 60, z + 30); r.camera.lookAt(x, 0, z); r.camera.updateMatrixWorld();
    r.world.setView(r.camera, x, z, 40);
    r.world.setView(r.camera, x, z, 40);
    const res = check(1e9, true);
    out.tris += res.tris;
    for (const f of res.sample) {
      const k = f.at.map(v => Math.round(v * 10)).join(',');
      if (seenAt.has(k)) continue;
      seenAt.add(k);
      out.count++; if (f.n[1] > 0.7) out.horiz++; if (Math.abs(f.n[1]) < 0.3) out.vert++;
      if (out.sample.length < maxReport) out.sample.push(f);
    }
  }
  return out;
}

const EPS = 0.004;
// Below this height the overlaps are ground paint laid flat over the ground (spawn pads, road lines), which the
// world shader draws in order; above it they are building faces.
const MIN_Y = +(params.get('miny') ?? 0.3);     // Metres: closer than this is the same plane at play distance.
function check(maxReport = 40, inner = false) {
  if (map.size === 'giant' && !inner) return checkGiant(maxReport);
  const tris = [];
  r.scene.updateMatrixWorld(true);
  const src = new Map();
  for (const [k, sys] of Object.entries({ world: r.world, props: r.props, ambient: r.ambient, chars: r.chars, weather: r.weather, combat: r.combat, vfx: r.vfx }))
    for (const v of Object.values(sys || {})) if (v && v.isObject3D) v.traverse(o => { if (!src.has(o)) src.set(o, k); });
  r.scene.traverse(o => {
    if (!o.isMesh || !o.geometry || !o.visible) return;
    const m = Array.isArray(o.material) ? o.material[0] : o.material;
    if (!m || m.transparent || m.depthWrite === false || m.depthTest === false) return;
    if (o.isInstancedMesh) return;
    const g = o.geometry, P = g.attributes.position;
    if (!P) return;
    const C = g.attributes.aCol || g.attributes.color;
    const idx = g.index ? g.index.array : null;
    const n = idx ? idx.length : P.count;
    const mw = o.matrixWorld, v = new THREE.Vector3();
    const get = i => v.fromBufferAttribute(P, i).applyMatrix4(mw).toArray();
    const ds = m.side === THREE.DoubleSide;
    for (let t = 0; t + 2 < n; t += 3) {
      const ia = idx ? idx[t] : t, ib = idx ? idx[t + 1] : t + 1, ic = idx ? idx[t + 2] : t + 2;
      const a = get(ia), b = get(ib), c = get(ic);
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], wx = c[0] - a[0], wy = c[1] - a[1], wz = c[2] - a[2];
      let nx = uy * wz - uz * wy, ny = uz * wx - ux * wz, nz = ux * wy - uy * wx;
      const l = Math.hypot(nx, ny, nz);
      if (l < 1e-6) continue;
      nx /= l; ny /= l; nz /= l;
      const col = C ? [C.getX(ia), C.getY(ia), C.getZ(ia)] : [0, 0, 0];
      tris.push({ a, b, c, nx, ny, nz, d: nx * a[0] + ny * a[1] + nz * a[2], col, name: (src.get(o) || '?') + ':' + (o.name || m.type) + ':' + o.renderOrder, ds, area: l / 2 });
    }
  });
  // Buckets by quantised normal and plane offset.
  const key = (t, dd) => `${Math.round(t.nx * 50)},${Math.round(t.ny * 50)},${Math.round(t.nz * 50)},${Math.round(t.d / EPS) + dd}`;
  const buckets = new Map();
  for (const t of tris) { const k = key(t, 0); (buckets.get(k) || buckets.set(k, []).get(k)).push(t); }
  const found = [];
  const proj = (t) => {
    // Drop the axis of the normal's largest component.
    const ax = Math.abs(t.nx), ay = Math.abs(t.ny), az = Math.abs(t.nz);
    const pick = ay >= ax && ay >= az ? [0, 2] : ax >= az ? [1, 2] : [0, 1];
    return [t.a, t.b, t.c].map(p => [p[pick[0]], p[pick[1]]]);
  };
  const overlap = (A, B) => {
    // 2-D separating axis, demanding a real overlap (not a shared edge).
    for (const T of [A, B]) for (let i = 0; i < 3; i++) {
      const p = T[i], q = T[(i + 1) % 3];
      const ax = -(q[1] - p[1]), ay = q[0] - p[0];
      const L = Math.hypot(ax, ay) || 1;
      let a0 = Infinity, a1 = -Infinity, b0 = Infinity, b1 = -Infinity;
      for (const s of A) { const d = (s[0] * ax + s[1] * ay) / L; a0 = Math.min(a0, d); a1 = Math.max(a1, d); }
      for (const s of B) { const d = (s[0] * ax + s[1] * ay) / L; b0 = Math.min(b0, d); b1 = Math.max(b1, d); }
      if (a1 <= b0 + 0.01 || b1 <= a0 + 0.01) return false;
    }
    return true;
  };
  const seen = new Set();
  for (const [k, list] of buckets) {
    const [qx, qy, qz, qd] = k.split(',').map(Number);
    const all = [...list];
    for (const dd of [1]) { const o = buckets.get(`${qx},${qy},${qz},${qd + dd}`); if (o) all.push(...o); }
    if (all.length < 2) continue;
    const P = all.map(proj);
    // Grid on the projected plane keeps this near-linear.
    const grid = new Map(), CELL = 2;
    P.forEach((T, i) => {
      const xs = T.map(p => p[0]), ys = T.map(p => p[1]);
      for (let gx = Math.floor(Math.min(...xs) / CELL); gx <= Math.floor(Math.max(...xs) / CELL); gx++)
        for (let gy = Math.floor(Math.min(...ys) / CELL); gy <= Math.floor(Math.max(...ys) / CELL); gy++) {
          const gk = gx * 100003 + gy;
          (grid.get(gk) || grid.set(gk, []).get(gk)).push(i);
          if (grid.get(gk).length > 4000) return;
        }
    });
    for (const ids of grid.values()) {
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++) {
        const A = all[ids[i]], B = all[ids[j]];
        if (A === B || Math.abs(A.d - B.d) > 0.003) continue;      // A few mm apart is already thousands of depth steps.
        const pk = ids[i] < ids[j] ? ids[i] + ':' + ids[j] : ids[j] + ':' + ids[i];
        if (seen.has(k + pk)) continue;
        seen.add(k + pk);
        const dc = Math.abs(A.col[0] - B.col[0]) + Math.abs(A.col[1] - B.col[1]) + Math.abs(A.col[2] - B.col[2]);
        if (dc < 0.02) continue;          // Same colour: fighting is invisible.
        if (A.ny < -0.3) continue;        // Undersides: the top-down camera never sees them.
        const y = Math.max(A.a[1], A.b[1], A.c[1]);
        if (y < MIN_Y) continue;          // Ground paint and decals (see the note on MIN_Y).
        if (!overlap(P[ids[i]], P[ids[j]])) continue;
        found.push({ at: A.a.map(x => +x.toFixed(2)), n: [A.nx, A.ny, A.nz].map(x => +x.toFixed(2)), dc: +dc.toFixed(2), area: +Math.min(A.area, B.area).toFixed(3), nameA: A.name, nameB: B.name, ...(params.has('tris') ? { A: [A.a, A.b, A.c].map(p => p.map(x => +x.toFixed(3))), B: [B.a, B.b, B.c].map(p => p.map(x => +x.toFixed(3))), cA: A.col.map(x => +x.toFixed(2)), cB: B.col.map(x => +x.toFixed(2)) } : {}) });
      }
    }
  }
  return { ms: Math.round(window.buildMs), tris: tris.length, count: found.length, horiz: found.filter(f => f.n[1] > 0.7).length, vert: found.filter(f => Math.abs(f.n[1]) < 0.3).length, sample: found.slice(0, maxReport) };
}
window.check = check;

// Flicker probe: renders the play camera at (x, z) and again nudged by 1 mm along the pan, and counts the pixels that
// jump by more than a quarter of full brightness between the two. Coplanar faces flip there; nothing else moves.
const THRESH = +(params.get("thresh") ?? 24);
const STEP = +(params.get('step') ?? 0.001);
window.flicker = (x, z, steps = 8, save = false) => {
  const cam = r.camera, W = 932, H = 430, gl = r.webgl;
  r.webgl.setPixelRatio(1); r.cssW = W; r.cssH = H; r._applyRes?.();
  cam.aspect = W / H; cam.fov = 26;
  const dist = 15 / (Math.tan(13 * Math.PI / 180) * cam.aspect), tilt = 55 * Math.PI / 180;
  const camY = dist * Math.sin(tilt);
  cam.near = Math.min(12, Math.max(3, Math.round((camY - 22) * 0.8)));
  cam.far = Math.min(240, Math.max(90, Math.ceil((camY * 1.8 + 40) / 10) * 10));
  if (params.has('near')) cam.near = +params.get('near');     // A tiny near plane coarsens depth like a weaker GPU.
  cam.updateProjectionMatrix();
  const shoot = (px) => {
    cam.position.set(px, camY, z + dist * Math.cos(tilt)); cam.lookAt(px, 0, z); cam.updateMatrixWorld();
    r.world.setView?.(cam, px, z, 60);
    gl.render(r.scene, cam);
    const ctx = gl.getContext(), buf = new Uint8Array(W * H * 4);
    ctx.readPixels(0, 0, W, H, ctx.RGBA, ctx.UNSIGNED_BYTE, buf);
    return buf;
  };
  let worst = 0, total = 0, shots = [];
  const mask = save ? new Uint8ClampedArray(W * H * 4) : null;
  let prev = shoot(x);
  if (save) shots.push(gl.domElement.toDataURL('image/png'));
  for (let i = 1; i <= steps; i++) {
    const cur = shoot(x + i * STEP);
    let n = 0;
    for (let k = 0; k < cur.length; k += 4) {
      const d = Math.abs(cur[k] - prev[k]) + Math.abs(cur[k + 1] - prev[k + 1]) + Math.abs(cur[k + 2] - prev[k + 2]);
      if (d > THRESH) { n++; if (mask) { mask[k] = 255; mask[k + 3] = 255; } }
    }
    worst = Math.max(worst, n); total += n; prev = cur;
  }
  let lum = 0; for (let k = 0; k < prev.length; k += 4) lum += prev[k];
  if (mask) {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const id = new ImageData(W, H);
    for (let yy = 0; yy < H; yy++) id.data.set(mask.subarray((H - 1 - yy) * W * 4, (H - yy) * W * 4), yy * W * 4);
    c.getContext('2d').putImageData(id, 0, 0); window.maskURL = c.toDataURL();
  }
  return { worst, total, lum: Math.round(lum / (prev.length / 4)) };
};
loadAll().then(() => { window.ready = true; });
</script>
</body>
</html>
