<!-- Root-relative, so modules that load assets by relative URL (map art, thumbnails) resolve as they do in the game. -->
<base href="../">
<!--
  Every menu screen and HUD state, rendered by the real modules with fake data, at chosen iPhone sizes side by side.

  Shell:  dev/ui-gallery.html                 pick scenes and sizes; frames load one at a time.
          ?scenes=title,lobby-host&sizes=se,16pm   preselect.  &zoom=0.6   frame scale.
  Frame:  dev/ui-gallery.html?frame=<scene>&size=<size id>    one scene, full size (what each iframe loads).
          &save=fresh|veteran   which fake save the menus read (in-memory; the real save is never touched).
          &gl=1                 HUD scenes over the live WebGL renderer instead of the map art.
          &wait=<ms>            settle time before __ready (default 900; the results reel uses 4500).
  Frames set window.__ready = true when settled, and record errors in window.__errors (Playwright reads both).
-->
<script>
// Frames run against an in-memory save so the gallery can pose any progression state and never touches the real one.
(() => {
  const q = new URLSearchParams(location.search);
  if (!q.has('frame')) return;
  const mem = new Map();
  const store = {
    getItem: k => (mem.has(k) ? mem.get(k) : null), setItem: (k, v) => { mem.set(k, String(v)); },
    removeItem: k => { mem.delete(k); }, clear: () => mem.clear(), key: i => [...mem.keys()][i] ?? null,
    get length() { return mem.size; },
  };
  try { Object.defineProperty(window, 'localStorage', { value: store, configurable: true }); } catch { /* falls back to the real one */ }
  window.__errors = [];
  addEventListener('error', e => window.__errors.push(String(e.message)));
  addEventListener('unhandledrejection', e => window.__errors.push(String(e.reason?.message ?? e.reason)));
})();
</script>

<script type="module">
const q = new URLSearchParams(location.search);

  p15:  { label: '15/16 852x393',      w: 852, h: 393, isl: 59, b: 21, island: true },
  p16p: { label: '16 Pro 874x402',     w: 874, h: 402, isl: 62, b: 21, island: true },
  plus: { label: '14 Plus 926x428',    w: 926, h: 428, isl: 47, b: 21, island: false },
  p16pl:{ label: '16 Plus 932x430',    w: 932, h: 430, isl: 59, b: 21, island: true },

// ---------------------------------------------------------------------------------------------------------------------
// Scenes. Each one builds a state with the real modules. Menus: Menu + its screens. HUD: HUD + Controls over the map art.
// ---------------------------------------------------------------------------------------------------------------------
const NAMES = ['Rookie', 'Bravo', 'Atlas', 'Cinder', 'Dusk', 'Echo', 'Fang', 'Ghost', 'Hex', 'Ion', 'Jinx', 'Kilo'];

const noop = () => {};

const menuScene = (label, fn, opts = {}) => ({ group: 'Menus', label, kind: 'menu', fn, ...opts });
const hudScene = (label, fn, opts = {}) => ({ group: 'HUD', label, kind: 'hud', fn, ...opts });

function fakeHumans(n, { long = false, host = 'me' } = {}) {
  return Array.from({ length: n }, (_, i) => ({

    badge: { prestige: i % 4, level: 1 + i * 7 },

}

  'lobby-full': menuScene('Lobby: 12, long names', ({ menu }) => menu.lobby({ code: 'K7QX', humans: fakeHumans(12, { long: true }), botSkill: 'elite', isHost: true, localId: 'me', hostId: 'me', countdown: null, rematchWait: false })),
  'vote': menuScene('Map vote', async ({ menu }) => {

  'gunsmith': menuScene('Gunsmith', ({ menu }) => menu.gunsmith({ loadoutIndex: 0, weapon: 'ar', onBack: noop, onChange: noop }), { gl: true }),

  'save-code': menuScene('Save code', ({ menu }) => menu.saveCode({ onBack: noop, onImported: noop })),
  'options': menuScene('Options', ({ menu }) => menu.options({ onBack: noop, onPreviewSound: noop })),
  'help': menuScene('Help', ({ menu }) => menu.help({ onBack: noop })),
  'stats': menuScene('Stats', async ({ menu }) => { const { statsScreen } = await import('./js/ui/stats.js'); statsScreen(menu, { onBack: noop }); }),

  // Some kills on a few guns, so locked cards show their progress bars part-way.

  }),
  'emblems': menuScene('Emblems picker', async ({ menu }) => {

    menu.profile({ onBack: noop, onChange: noop, onRename: noop, onSave: noop });

  }),
  'results-win': menuScene('Results: win', ({ menu, results }) => menu.results(results('win'), { rematch: noop, menu: noop }), { gl: true, settle: 4500 }),
  'results-loss': menuScene('Results: loss', ({ menu, results }) => menu.results(results('loss'), { rematch: noop, menu: noop }), { gl: true, settle: 4500 }),
  'results-draw': menuScene('Results: draw, long names', ({ menu, results }) => menu.results(results('draw', true), { rematch: noop, menu: noop }), { gl: true, settle: 4500 }),
  // The tallest results screen: Ground War (16 a side), five XP lines, three weapons, challenges and Pro challenges.
  'results-gw': menuScene('Results: Ground War loss, challenges, Pro', ({ menu, results }) => menu.results(results('loss', false, true), { rematch: noop, menu: noop }), { gl: true, settle: 4500 }),
  'install': menuScene('Install prompt', ({ menu }) => { menu.title({}); menu.installPrompt(noop); }),

  'hud-live': hudScene('Live, TDM', () => {}),
  'hud-feed': hudScene('Kill feed and medals', ({ emit }) => {
    emit({ t: 'kill', by: 'me', target: 'p7', weapon: 'lmg', camo: 'none', x: 40, z: 22, assist: null, dist: 9 });
    emit({ t: 'medal', id: 'me', medal: 'double' });
    emit({ t: 'kill', by: 'p8', target: 'p2', weapon: 'sniper', camo: 'none', x: 30, z: 22, assist: null, dist: 30 });
    emit({ t: 'kill', by: 'p3', target: 'p9', weapon: 'shotgun', camo: 'none', x: 30, z: 22, assist: 'p4', dist: 3 });
  }, { frames: 20 }),
  'hud-hurt': hudScene('Low health, taking fire', ({ me, emit }) => { me.hp = 22; emit({ t: 'hit', by: 'p7', target: 'me', dmg: 30, x: me.x, z: me.z, killed: false }); }, { frames: 8 }),
  'hud-reload': hudScene('Reloading, ADS', ({ me }) => { me.ammo = 0; me.reloadT = 1.1; me.reloadDur = 2.2; me.adsT = 1; }),
  'hud-streak': hudScene('Streak ready', ({ me }) => { me.score = 1200; me.streakReady = 'uav'; me.slots = [{ kind: 'uav', cost: 1000, held: true, blocked: false }, { kind: 'turret', cost: 2100, held: true, blocked: false }, { kind: 'gunship', cost: 4800, held: false, blocked: false }]; }),
  'hud-dead': hudScene('Dead, respawn picker', ({ me, view }) => { me.alive = false; me.hp = 0; me.respawnT = 2.1; view.lastKill = { by: 'p7', target: 'me', weapon: 'sniper', camo: 'none', x: 30, z: 20 }; }, { frames: 10 }),
  'hud-dead-pick': hudScene('Dead, picking next loadout', ({ me, view }) => { me.alive = false; me.hp = 0; me.respawnT = 2.1; view.lastKill = { by: 'p7', target: 'me', weapon: 'sniper', camo: 'none', x: 30, z: 20 }; setTimeout(() => document.querySelector('.dn-change')?.click(), 0); }, { frames: 10 }),
  'hud-killcam': hudScene('Dead, death replay', ({ me, view, emit }) => {
    me.alive = false; me.hp = 0; me.respawnT = 3.4;
    emit({ t: 'kill', by: 'p9', target: 'me', weapon: 'sniper', camo: 'none', x: 30, z: 20, assist: null, dist: 31, head: true });
    // The banner and Skip as js/game/killcam.js builds them.
    document.body.insertAdjacentHTML('beforeend', '<div class="killcam-banner on" data-kind="death"><i class="kc-rec"></i><b class="kc-title">Killcam</b><span class="kc-who">Ion got you</span></div><button class="killcam-skip on">Skip</button>');
    document.body.classList.add('killcam-on');
  }, { frames: 10 }),
  'hud-warmup':hudScene('Warmup', ({ view }) => { view.phase = 'warmup'; view.timeLeft = 600; view.scores = [0, 0]; }),
  'hud-dom': hudScene('Domination', ({ view }) => { view.mode = 'dom'; view.scores = [130, 112]; }, { mode: 'dom', scoreLimit: 200 }),
  'hud-hard': hudScene('Hardpoint', ({ view }) => { view.mode = 'hard'; view.scores = [88, 101]; }, { mode: 'hard', scoreLimit: 150 }),
  'hud-kc': hudScene('Kill Confirmed', ({ view }) => { view.mode = 'kc'; view.scores = [41, 40]; }, { mode: 'kc', scoreLimit: 65 }),
  'hud-board': hudScene('Scoreboard', ({ hud }) => hud.toggleBoard?.()),
  'hud-final': hudScene('Last kills, max values', ({ view, me }) => { view.scores = [74, 74]; view.timeLeft = 9; me.kills = 99; me.deaths = 99; me.score = 9990; me.ammo = 150; me.reserve = 999; }),

  'icons': { group: 'System', label: 'Icon sheet', kind: 'sheet', fn: iconSheet },
  'tokens': { group: 'System', label: 'Tokens and plates', kind: 'sheet', fn: tokenSheet },
};

// ---------------------------------------------------------------------------------------------------------------------
// Frame mode
// ---------------------------------------------------------------------------------------------------------------------
async function runFrame(id) {
  const size = SIZES[q.get('size')] ?? SIZES.p13;
  const scene = SCENES[id];
  document.head.insertAdjacentHTML('beforeend', '<link rel="stylesheet" href="css/game.css">');
  document.getElementById('shell-css').remove();
  const root = document.documentElement;
  // Safe areas: iOS reports the island inset on both long sides in landscape, plus the home indicator.
  root.style.setProperty('--env-l', size.isl + 'px');
  root.style.setProperty('--env-r', size.isl + 'px');
  root.style.setProperty('--env-b', size.b + 'px');
  const ui = document.getElementById('ui');
  try {
    if (!scene) throw new Error('No scene ' + id);
    await new Promise(r => (document.readyState === 'complete' ? r() : addEventListener('load', r, { once: true })));
    await document.fonts.ready;
    const { installViewport } = await import('./js/ui/viewport.js');
    installViewport();
    const { installTaps, setTapSound } = await import('./js/ui/tap.js');
    installTaps();
    setTapSound(kind => console.log('ui sound', kind));
    if (q.get('save') === 'veteran') {
      const { Progress } = await import('./js/ui/progress.js');
      Progress.addXp?.(2_000_000);
      // Every gun at weapon prestige III and level 30: the widest level and rank marks the screens ever print.
      const { WEAPON_IDS } = await import('./js/shared/constants.js');
      const max = w => Progress.applyMatch({ xp: 0, weapons: { [w]: { xp: 1e7, kills: 0 } } });
      for (const w of WEAPON_IDS) { for (let i = 0; i < 3; i++) { max(w); Progress.prestigeWeapon(w); } max(w); }
    }
    if (scene.kind === 'menu') await menuFrame(scene, ui);
    else if (scene.kind === 'hud') await hudFrame(scene, ui);
    else await scene.fn(ui);
  } catch (e) {
    window.__errors.push(String(e?.stack ?? e));
    ui.insertAdjacentHTML('beforeend', `<pre style="position:fixed;inset:auto 0 0 0;z-index:999;margin:0;padding:6px;background:#a52a1f;color:#fff;font:11px monospace;white-space:pre-wrap">${String(e?.stack ?? e).replace(/</g, '&lt;')}</pre>`);
  }
  // Let entrances settle before anyone screenshots. Timed sequences (the results reel) ask for longer; &wait= overrides.
  await new Promise(r => setTimeout(r, Number(q.get('wait') ?? scene?.settle ?? 900)));
  window.__ready = true;
}

async function menuFrame(scene, ui) {
  if (!scene.gl) document.getElementById('game').remove();
  const { Menu } = await import('./js/ui/menu.js');
  const menu = new Menu(ui);
  menu.show?.();
  const cache = {};
  for (const o of ['win', 'loss', 'draw']) if (scene.label.toLowerCase().includes(o)) cache[o] = await fakeResults(o, scene.label.includes('long'), scene.label.includes('Ground War'));
  await scene.fn({ menu, results: o => cache[o] });
}

// A results payload shaped like main.js's, with XP, level, weapon progress and unlocks from the real Progress
// (applied to the in-memory save, so a level-up and its unlocks show).
async function fakeResults(outcome, long, groundWar = false) {
  const { Progress, matchScore } = await import('./js/ui/progress.js');
  const side = groundWar ? 16 : 6;
  const roster = Array.from({ length: side * 2 }, (_, i) => ({
    id: i === 0 ? 'me' : 'p' + i, name: long && i % 3 === 1 ? LONG : NAMES[i % NAMES.length] + (i >= NAMES.length ? i : ''), team: i < side ? 0 : 1, isBot: i > 2,
    kills: groundWar ? 40 - i % 16 * 2 : [24, 15, 12, 9, 6, 2, 18, 14, 10, 8, 5, 1][i], deaths: groundWar ? 9 + i % 11 : [8, 11, 9, 12, 13, 15, 12, 10, 14, 9, 11, 16][i],
    assists: i % 5, head: i % 4, score: 3000 - i * 210, captures: i % 3, defends: i % 2, confirms: i % 4, denies: i % 3,
    badge: { prestige: i % 4, level: 5 + i * 4 }, weapon: ['ar', 'smg', 'sniper', 'lmg', 'shotgun', 'dmr'][i % 6],
  }));
  const lines = [['Match played', 200], ['Kills x24', 2400], ['Headshots x6', 150], ['Medals x5', 125]];
  if (groundWar) lines.splice(3, 0, ['Assists x3', 150]);
  if (outcome === 'win') lines.push(['Win', 500]); else if (outcome === 'draw') lines.push(['Draw', 200]);
  const total = lines.reduce((a, l) => a + l[1], 0);
  const applied = Progress.applyMatch({ xp: total + 6000, weapons: { lmg: { xp: 2600, kills: 18, head: 4 }, pistol: { xp: 400, kills: 6 }, ...(groundWar ? { smg: { xp: 900, kills: 7 } } : {}) } });
  let mvp = roster[0];
  for (const p of roster) if ((matchScore?.(p) ?? p.score) > (matchScore?.(mvp) ?? mvp.score)) mvp = p;
  return {
    outcome, mode: 'tdm', scores: outcome === 'win' ? [75, 61] : outcome === 'loss' ? [58, 75] : [70, 70], myTeam: 0, localId: 'me',
    roster, players: roster, badges: new Map(roster.map(r => [r.id, r.badge])), mvp,
    xp: { total, lines }, level: applied.level, weapons: applied.weapons, unlocks: applied.unlocks,
    finalKill: { weapon: 'sniper', camo: 'none', byName: roster[0].name, targetName: roster[7].name },
    rematchLabel: 'Rematch', note: '',
    // A win shows the common case of a single challenge row, which sits over the buttons rather than in its own card.
    ...(outcome === 'win' ? { challenges: [{ id: 'c0', label: 'Play 2 Free-for-All matches', icon: 'mode:ffa', before: 0, value: 1, goal: 2, fresh: false, xp: 800, period: 'daily' }] } : {}),
    ...(groundWar ? {
      mode: 'gwtdm', modeId: 'gwtdm', scores: [240, 250],
      challenges: [
        { id: 'c1', label: 'Get 200 kills', icon: 'ui:skull', before: 16, value: 40, goal: 200, fresh: false, xp: 2000, period: 'weekly' },
        { id: 'c2', label: 'Get 90 kills with SMGs', icon: 'smg', before: 23, value: 30, goal: 90, fresh: false, xp: 1500, period: 'weekly' },
        { id: 'c3', label: 'Get 50 headshot kills in one long week of play', icon: 'headshot', before: 11, value: 24, goal: 50, fresh: true, xp: 1200, period: 'daily' },
        { id: 'c4', label: 'Win 3 Domination matches', icon: 'mode:dom', before: 1, value: 2, goal: 3, fresh: false, xp: 900, period: 'daily' },
        { id: 'c5', label: 'Get 25 kills with LMGs', icon: 'lmg', before: 4, value: 25, goal: 25, fresh: true, xp: 1000, period: 'daily' },
        { id: 'c6', label: 'Call in 10 scorestreaks', icon: 'uav', before: 2, value: 5, goal: 10, fresh: false, xp: 1500, period: 'weekly' },
      ],
      proProgress: [
        { perk: 'marathon', name: 'Adrenaline', done: false, steps: [{ before: 3, value: 7, goal: 10 }, { before: 0, value: 4, goal: 6 }] },
        { perk: 'scavenger', name: 'Scavenger', done: true, steps: [{ before: 9, value: 10, goal: 10 }, { before: 5, value: 6, goal: 6 }] },
        { perk: 'ghost', name: 'Ghost', done: false, steps: [{ before: 1, value: 3, goal: 20 }, { before: 0, value: 2, goal: 15 }] },
      ],
    } : {}),
  };
}

async function hudFrame(scene, ui) {
  const mapId = q.get('map') ?? 'railyard';
  const canvas = document.getElementById('game');
  const useGl = q.get('gl') === '1';
  if (!useGl) {
    canvas.remove();
    document.body.style.background = `#1d232b url(assets/maps/${mapId}.jpg) center / cover`;
  }
  const [{ HUD }, { Controls }] = await Promise.all([import('./js/ui/hud.js'), import('./js/ui/controls.js')]);
  const controls = new Controls(ui);
  const hud = new HUD(ui);
  hud.bindControls?.(controls);
  const weapons = ['lmg', 'smg', 'shotgun', 'ar', 'sniper', 'dmr', 'burst', 'pdw', 'rotary', 'lever', 'pistol', 'launcher'];
  const anchors = [[36, 24], [40, 18], [28, 30], [40, 26], [24, 22], [33, 30], [44, 24], [41, 15], [46, 31], [50, 20], [37, 21], [33, 29]];
  const players = anchors.map((a, i) => ({
    id: i === 0 ? 'me' : 'p' + i, name: i === 5 ? LONG : NAMES[i], team: i < 6 ? 0 : 1, isBot: i > 0, skill: 'regular',
    x: a[0], z: a[1], aim: -0.4, vx: 0, vz: 0, hp: 100, alive: true, respawnT: 0, weapon: weapons[i], camo: 'none',
    ammo: 30, reserve: 90, reloadT: 0, reloadDur: 2, adsT: 0, sprinting: false, sliding: false, spawnProtect: false,
    kills: (11 - i) * 2, deaths: i, streak: 0, streakReady: null, bloom: 0, badge: { prestige: i % 4, level: 10 + i * 3 },
    score: 400, capped: false, slots: [{ kind: 'uav', cost: 1000, held: false, blocked: false }, { kind: 'turret', cost: 2100, held: false, blocked: false }, { kind: 'gunship', cost: 4800, held: false, blocked: false }],
    heat: 0, overheated: false, head: 11 - i, assists: i * 2, firingT: 0, tacticalLeft: 2, lethalLeft: 2, tactical: 'smoke', lethal: 'frag',
  }));
  const view = {
    t: 0, phase: 'live', timeLeft: 312, scores: [42, 37], winner: null, uav: [0, 0], players, localId: 'me', lastKill: null,
    projectiles: [], smokes: [], turrets: [], gunships: [], mode: scene.mode ?? 'tdm', theme: mapId,
  };
  hud.prepare?.({ mapId, scoreLimit: scene.scoreLimit ?? 75, roster: players, mode: view.mode, localId: 'me', intro: false });
  hud.setVisible?.(true);
  controls.setEnabled?.(true);
  let renderer = null;
  if (useGl) {
    const [{ GameRenderer }, { MAPS }] = await Promise.all([import('./js/render/renderer.js'), import('./js/shared/map.js')]);
    renderer = new GameRenderer(canvas, MAPS[mapId], { dynamicRes: false });
    renderer.setLocal('me');
  }
  const events = [];
  const step = dt => { view.t += dt; renderer?.update(view, events, dt); hud.onEvents(events); hud.update(view, dt); events.length = 0; };
  step(1 / 60);
  await scene.fn({ hud, controls, view, me: players[0], players, emit: e => events.push(e) });
  // A fixed number of frames, so the pose is the same on every run. Then a slow idle loop keeps timers honest.
  for (let i = 0; i < (scene.frames ?? 4); i++) { step(1 / 60); await new Promise(r => requestAnimationFrame(r)); }
  window.__hud = { hud, view, step };
}

// ---- System sheets ----

function sheetRoot(ui) {
  document.getElementById('game').remove();
  const el = document.createElement('div');
  el.className = 'gallery-sheet';
  ui.replaceWith(el);
  return el;
}
async function iconSheet(ui) {
  ui = sheetRoot(ui);
  const { icon, ICON_GROUPS } = await import('./js/ui/icons.js');
  ui.style.cssText = 'position:absolute;inset:0;overflow:auto;pointer-events:auto;padding:calc(var(--sl) * 0 + 10px);background:var(--c-ballast);';
  let h = '';

    h += `<div class="t-label" style="margin:8px 0 4px">${g}</div><div style="display:flex;flex-wrap:wrap;gap:4px">`;

  }
  ui.innerHTML = h;
}

// ---------------------------------------------------------------------------------------------------------------------
// Shell
// ---------------------------------------------------------------------------------------------------------------------
function runShell() {
  document.body.className = 'shell';
  document.getElementById('game').remove();
  document.getElementById('ui').remove();
  const picked = new Set((q.get('scenes') ?? 'title,lobby-host,hud-live,hud-feed').split(','));
  const sizes = new Set((q.get('sizes') ?? 'se,p13,pm').split(','));
  let zoom = Number(q.get('zoom') ?? 0.5);
  const save = q.get('save') ?? 'fresh';
  const groups = {};
  for (const [id, s] of Object.entries(SCENES)) (groups[s.group] ??= []).push([id, s]);
  document.body.insertAdjacentHTML('beforeend', `
    <header>
      <h1>UI GALLERY</h1>
      <fieldset><legend>Sizes</legend>${Object.entries(SIZES).map(([id, s]) => `<label><input type="checkbox" name="size" value="${id}" ${sizes.has(id) ? 'checked' : ''}>${s.label}</label>`).join('')}</fieldset>
      ${Object.entries(groups).map(([g, list]) => `<fieldset><legend>${g}</legend>${list.map(([id, s]) => `<label><input type="checkbox" name="scene" value="${id}" ${picked.has(id) ? 'checked' : ''}>${s.label}</label>`).join('')}</fieldset>`).join('')}
      <fieldset><legend>Save</legend><label><input type="checkbox" name="save" value="veteran" ${save === 'veteran' ? 'checked' : ''}>Veteran</label></fieldset>
      <fieldset><legend>Zoom</legend><input type="range" min="0.25" max="1" step="0.05" value="${zoom}" name="zoom"></fieldset>
      <button id="all">All scenes</button><button id="go">Render</button>
    </header>
    <main class="grid"></main>`);
  const grid = document.querySelector('.grid');
  const checked = name => [...document.querySelectorAll(`input[name=${name}]:checked`)].map(i => i.value);
  document.getElementById('all').onclick = () => { document.querySelectorAll('input[name=scene]').forEach(i => { i.checked = true; }); render(); };
  document.getElementById('go').onclick = render;
  document.querySelector('input[name=zoom]').oninput = e => { zoom = Number(e.target.value); document.querySelectorAll('.box').forEach(fitBox); };

  function fitBox(box) {
    const s = SIZES[box.dataset.size], f = box.querySelector('iframe');
    box.style.width = s.w * zoom + 'px'; box.style.height = s.h * zoom + 'px';
    f.style.transform = `scale(${zoom})`;
  }

  // Frames load one after another: a dozen WebGL contexts at once would stall the page.
  let queue = [], loading = false;
  function pump() {
    if (loading || !queue.length) return;
    loading = true;
    const { box, src } = queue.shift();
    const f = box.querySelector('iframe');
    const doneLoad = () => {
      const tick = () => {
        let ready = false, errs = [];
        try { ready = f.contentWindow.__ready; errs = f.contentWindow.__errors ?? []; } catch { ready = true; }
        if (!ready) return setTimeout(tick, 100);
        if (errs.length) box.parentElement.querySelector('figcaption').insertAdjacentHTML('beforeend', ` <span class="err">${errs.length} error(s): ${errs[0].slice(0, 120).replace(/</g, '&lt;')}</span>`);
        loading = false;
        pump();
      };
      tick();
    };
    f.addEventListener('load', doneLoad, { once: true });
    f.src = src;
  }

  function render() {
    const scenes = checked('scene'), sz = checked('size'), vet = checked('save').length ? 'veteran' : 'fresh';
    history.replaceState(null, '', `dev/ui-gallery.html?scenes=${scenes.join(',')}&sizes=${sz.join(',')}&zoom=${zoom}&save=${vet}`);
    queue = []; loading = false;
    grid.innerHTML = scenes.map(id => `
      <section class="row"><h2>${SCENES[id].label.toUpperCase()}</h2><div class="frames">${sz.map(s => `
        <figure>
          <div class="box" data-size="${s}">${SIZES[s].island ? '<i class="island" style="left:1.2%"></i>' : ''}${SIZES[s].b ? '<i class="home"></i>' : ''}
            <iframe width="${SIZES[s].w}" height="${SIZES[s].h}" loading="eager" title="${id} ${s}"></iframe></div>
          <figcaption>${SIZES[s].label}</figcaption>
        </figure>`).join('')}</div></section>`).join('');
    grid.querySelectorAll('.box').forEach(box => {
      fitBox(box);
      const id = box.closest('.row').querySelector('iframe').title.split(' ')[0];
      queue.push({ box, src: `dev/ui-gallery.html?frame=${box.querySelector('iframe').title.split(' ')[0]}&size=${box.dataset.size}&save=${vet}` });
    });
    pump();
  }
  render();
}

if (q.has('frame')) runFrame(q.get('frame'));
else runShell();
